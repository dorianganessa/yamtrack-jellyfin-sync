name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tests -v
      - name: Validate Compose
        run: docker compose --env-file .env.example config -q
      - name: Test the built container
        run: |
          docker build -t yamtrack-jellyfin-sync:test .
          docker run --rm --network none --read-only --tmpfs /tmp --user 1000:1000 \
            -v "$PWD/tests:/tests:ro" --entrypoint python \
            yamtrack-jellyfin-sync:test -m unittest discover -s /tests -v
